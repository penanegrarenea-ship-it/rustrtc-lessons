<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustRTC Chat</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        #chat-box {
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 5px;
        }

        .sent {
            color: blue;
        }

        .received {
            color: green;
        }
    </style>
</head>

<body>
    <h1>RustRTC DataChannel Chat</h1>
    <div id="status">Status: Disconnected</div>
    <div id="chat-box"></div>
    <input type="text" id="name-input" placeholder="Enter your name">
    <input type="text" id="msg-input" placeholder="Type a message..." disabled>
    <button id="send-btn" disabled>Send</button>
    <button id="connect-btn">Connect</button>
    <button id="disconnect-btn" disabled>Disconnect</button>

    <script>
        const statusDiv = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');
        const nameInput = document.getElementById('name-input');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');

        let pc = null;
        let dc = null;
        // 0018: ids this page sent and has not yet matched to an ack.
        // Cleared on disconnect. Existing lines are left unchanged.
        const pending = new Map();

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.textContent = msg;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function ownLine(content, id, status) {
            return "Me: " + content + "（id=" + id + "）" + status;
        }

        connectBtn.onclick = async () => {
            const name = nameInput.value.trim();
            if (!name) {
                alert("Please enter a name");
                return;
            }

            pending.clear();
            connectBtn.disabled = true;
            nameInput.disabled = true;
            statusDiv.textContent = "Status: Connecting...";

            pc = new RTCPeerConnection();

            // Use negotiated data channel (ID=0) to match server behavior
            dc = pc.createDataChannel("chat", { negotiated: true, id: 0 });
            setupDataChannel(dc, name);

            pc.onicecandidate = e => {
                if (e.candidate) {
                    console.log("New candidate", e.candidate);
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // Wait for ICE gathering to complete (simple approach)
            await new Promise(resolve => {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                } else {
                    const checkIce = () => {
                        if (pc.iceGatheringState === 'complete') {
                            pc.removeEventListener('icegatheringstatechange', checkIce);
                            resolve();
                        }
                    };
                    pc.addEventListener('icegatheringstatechange', checkIce);
                }
            });

            const response = await fetch('/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sdp: pc.localDescription.sdp })
            });

            const answer = await response.json();
            await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answer.sdp }));
        };

        disconnectBtn.onclick = () => {
            pending.clear();
            if (pc) {
                pc.close();
                pc = null;
            }
            const closing = dc;
            dc = null;
            if (closing) {
                closing.close();
            }
            statusDiv.textContent = "Status: Disconnected";
            msgInput.disabled = true;
            sendBtn.disabled = true;
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            nameInput.disabled = false;
            log("Disconnected", "info");
        };

        function setupDataChannel(channel, name) {
            channel.onopen = () => {
                statusDiv.textContent = "Status: Connected";
                msgInput.disabled = false;
                sendBtn.disabled = false;
                disconnectBtn.disabled = false;
                log("Connected as " + name, "info");

                // Send login message
                channel.send(JSON.stringify({ type: "login", name: name }));
            };
            channel.onmessage = e => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'chat') {
                        log(msg.sender + ": " + msg.content + "（id=" + msg.id + "）", "received");
                        if (msg.id && channel.readyState === 'open') {
                            channel.send(JSON.stringify({ type: "ack", id: msg.id }));
                        }
                    } else if (msg.type === 'ack') {
                        const item = pending.get(msg.id);
                        if (!item || !msg.receiver) {
                            return;
                        }
                        pending.delete(msg.id);
                        item.el.textContent = ownLine(
                            item.content,
                            msg.id,
                            "收到" + msg.receiver + "应用确认"
                        );
                    } else if (msg.type === 'system') {
                        log("[System]: " + msg.content, "info");
                    }
                } catch (err) {
                    log("Raw: " + e.data, "received");
                }
            };
            channel.onclose = () => {
                if (dc !== channel) {
                    return;
                }
                pending.clear();
                statusDiv.textContent = "Status: Disconnected";
                msgInput.disabled = true;
                sendBtn.disabled = true;
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                nameInput.disabled = false;
                log("DataChannel Closed", "info");
            };
        }

        sendBtn.onclick = () => {
            const msg = msgInput.value;
            if (!(msg && dc && dc.readyState === 'open')) {
                return;
            }
            if (!crypto.randomUUID) {
                log("当前浏览器没有 crypto.randomUUID，未发送", "info");
                return;
            }
            const id = crypto.randomUUID();
            try {
                dc.send(JSON.stringify({ type: "chat", id: id, content: msg }));
            } catch (err) {
                log("发送失败，未得到对端确认", "info");
                return;
            }
            const el = log(ownLine(msg, id, "本地已提交，尚无对端确认"), "sent");
            pending.set(id, { el: el, content: msg });
            msgInput.value = '';
        };

        msgInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendBtn.click();
        };
    </script>
</body>

</html>
